<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Ribbon Sashes (Behind bottom of shield) -->
  <path d="M74 135 L54 182 L72 172 L86 182 L84 145 Z" fill="#55BBDA" stroke="#141416" stroke-width="3" stroke-linejoin="round" />
  <path d="M126 135 L146 182 L128 172 L114 182 L116 145 Z" fill="#55BBDA" stroke="#141416" stroke-width="3" stroke-linejoin="round" />

  <!-- Shield Drop Shadow -->
  <path d="M62 34 L142 34 C142 34 146 96 102 144 C58 96 62 34 62 34 Z" fill="#141416" opacity="0.12" />

  <!-- Regal Shield Crest Body (Rich Royal Purple) -->
  <path d="M60 30 L140 30 C140 30 144 94 100 140 C56 94 60 30 60 30 Z" 
        fill="#8B5CF6" stroke="#141416" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Inner Shield Trim (Lilac / White) -->
  <path d="M68 38 L132 38 C132 38 135 90 100 128 C65 90 68 38 68 38 Z" 
        fill="#C4B5FD" stroke="#141416" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Central Star Rosette (Warm Orange / Gold) -->
  <circle cx="100" cy="78" r="28" fill="#EA552B" stroke="#141416" stroke-width="3" />
  <circle cx="100" cy="78" r="22" fill="#F7D046" stroke="#141416" stroke-width="2" />

  <!-- Center Level-Up Star -->
  <path d="M100 64 L103 72 L112 73 L105 79 L107 88 L100 83 L93 88 L95 79 L88 73 L97 72 Z" 
        fill="#FFFFFF" stroke="#141416" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Upward Level Chevron / Rank Arrow -->
  <path d="M92 114 L100 106 L108 114" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Achievement Sparkles -->
  <path d="M156 50 Q156 56 162 56 Q156 56 156 62 Q156 56 150 56 Q156 56 156 50 Z" fill="#F7D046" stroke="#141416" stroke-width="1.5" />
  <path d="M42 60 L42 68 M38 64 L46 64" stroke="#141416" stroke-width="2" stroke-linecap="round" />
  <circle cx="152" cy="110" r="2.5" fill="#141416" />
</svg>