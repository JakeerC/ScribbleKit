<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- ScribbleKit: Bullseye Accuracy Badge -->
  <defs>
    <filter id="soft-shadow-bullseye" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#141416" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Pinned Bar / Clasp at Top -->
  <g filter="url(#soft-shadow-bullseye)">
    <!-- Clasp shadow -->
    <rect x="52" y="22" width="96" height="20" rx="6" fill="#141416" opacity="0.1" />
    <!-- Clasp body -->
    <rect x="50" y="20" width="100" height="20" rx="6" fill="#55BBDA" stroke="#141416" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Clasp pin highlight & detail -->
    <rect x="56" y="25" width="88" height="4" rx="2" fill="#FFFFFF" opacity="0.6" />
    <line x1="100" y1="20" x2="100" y2="40" stroke="#141416" stroke-width="2.5" stroke-dasharray="3 3" />
  </g>

  <!-- Hanging Ribbon Straps -->
  <g stroke="#141416" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ribbon Tail -->
    <polygon points="68,38 52,106 68,98 84,106 80,38" fill="#EA552B" stroke-width="3" />
    <line x1="68" y1="42" x2="68" y2="92" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />
    <!-- Right Ribbon Tail -->
    <polygon points="120,38 116,106 132,98 148,106 132,38" fill="#F7D046" stroke-width="3" />
    <line x1="132" y1="42" x2="132" y2="92" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />
  </g>

  <!-- Circular Target Medallion -->
  <g filter="url(#soft-shadow-bullseye)">
    <!-- Outer Medallion Bezel Shadow -->
    <circle cx="100" cy="118" r="54" fill="#141416" opacity="0.12" />
    
    <!-- Scalloped Outer Disc -->
    <circle cx="100" cy="116" r="52" fill="#FBE8DE" stroke="#141416" stroke-width="3.5" />
    
    <!-- Outer Red Ring -->
    <circle cx="100" cy="116" r="42" fill="#EA552B" stroke="#141416" stroke-width="3" />
    
    <!-- White Middle Ring -->
    <circle cx="100" cy="116" r="30" fill="#FFFFFF" stroke="#141416" stroke-width="2.5" />
    
    <!-- Bullseye Center Circle -->
    <circle cx="100" cy="116" r="18" fill="#EA552B" stroke="#141416" stroke-width="2.5" />
    
    <!-- Center Hit Sparkle / Star Core -->
    <polygon points="100,106 103,113 110,116 103,119 100,126 97,119 90,116 97,113" fill="#F7D046" stroke="#141416" stroke-width="2" />
    
    <!-- Crosshairs Reticle Lines -->
    <line x1="100" y1="70" x2="100" y2="78" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="154" x2="100" y2="162" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    <line x1="54" y1="116" x2="62" y2="116" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    <line x1="138" y1="116" x2="146" y2="116" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    
    <!-- Target Reflection / Highlight Arc -->
    <path d="M 72 94 A 38 38 0 0 1 128 94" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Accuracy Arrow Feather Feathering into Bullseye -->
  <g stroke="#141416" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow Shaft from top-right -->
    <line x1="146" y1="70" x2="106" y2="110" stroke="#141416" stroke-width="3.5" />
    <line x1="145" y1="71" x2="108" y2="108" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Arrow Fletching Fins -->
    <polygon points="146,70 156,66 150,78 140,76" fill="#55BBDA" stroke="#141416" stroke-width="2" />
    <polygon points="146,70 148,58 136,64 140,76" fill="#F7D046" stroke="#141416" stroke-width="2" />
  </g>

  <!-- Retro Sparkles & Pop Dots -->
  <path d="M 36 78 Q 40 82 44 82 Q 40 82 36 86 Q 40 82 36 78" fill="#F7D046" stroke="#141416" stroke-width="1.8" />
  <circle cx="166" cy="132" r="3" fill="#EA552B" stroke="#141416" stroke-width="1.8" />
  <circle cx="34" cy="142" r="2.5" fill="#55BBDA" stroke="#141416" stroke-width="1.5" />
  <path d="M 160 48 Q 163 52 167 52 Q 163 52 160 56 Q 163 52 160 48" fill="#55BBDA" stroke="#141416" stroke-width="1.8" />
</svg>
