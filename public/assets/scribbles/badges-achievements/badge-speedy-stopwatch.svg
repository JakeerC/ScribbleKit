<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- ScribbleKit: Speedy Stopwatch Quiz Badge -->
  <defs>
    <filter id="soft-shadow-stopwatch" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#141416" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Motion Speed Streaks (Background Left) -->
  <g stroke="#141416" stroke-linecap="round" opacity="0.8">
    <path d="M 20 86 Q 32 86 46 88" fill="none" stroke-width="3" stroke-dasharray="8 4" />
    <path d="M 14 104 Q 30 104 42 106" fill="none" stroke-width="3" stroke-dasharray="10 5" />
    <path d="M 24 122 Q 36 122 50 124" fill="none" stroke-width="2.5" />
  </g>

  <!-- Ribbon Tails (Hanging below) -->
  <g stroke="#141416" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-shadow-stopwatch)">
    <!-- Left Ribbon -->
    <polygon points="86,130 62,182 82,172 98,184 94,130" fill="#0BDC85" stroke-width="3" />
    <line x1="78" y1="136" x2="80" y2="170" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
    
    <!-- Right Ribbon -->
    <polygon points="106,130 102,184 118,172 138,182 114,130" fill="#55BBDA" stroke-width="3" />
    <line x1="122" y1="136" x2="120" y2="170" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
  </g>

  <!-- Stopwatch Body -->
  <g filter="url(#soft-shadow-stopwatch)">
    <!-- Top Plunger / Crown Mechanism -->
    <rect x="94" y="24" width="12" height="10" rx="3" fill="#F7D046" stroke="#141416" stroke-width="2.8" />
    <path d="M 86 28 C 86 16 114 16 114 28" fill="none" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    <!-- Secondary Lap Button at 45 deg -->
    <rect x="132" y="38" width="8" height="10" rx="2" transform="rotate(45 136 43)" fill="#EA552B" stroke="#141416" stroke-width="2.5" />

    <!-- Outer Stopwatch Ring Shadow -->
    <circle cx="100" cy="98" r="50" fill="#141416" opacity="0.12" />

    <!-- Outer Chrome Casing -->
    <circle cx="100" cy="96" r="48" fill="#F7D046" stroke="#141416" stroke-width="3.5" />
    
    <!-- Inner Bezel -->
    <circle cx="100" cy="96" r="40" fill="#FFFFFF" stroke="#141416" stroke-width="3" />

    <!-- Clock Face Dial Markers -->
    <line x1="100" y1="60" x2="100" y2="67" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="125" x2="100" y2="132" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="96" x2="71" y2="96" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    <line x1="129" y1="96" x2="136" y2="96" stroke="#141416" stroke-width="3" stroke-linecap="round" />
    <!-- Minor ticks -->
    <line x1="123" y1="73" x2="119" y2="77" stroke="#141416" stroke-width="2" stroke-linecap="round" />
    <line x1="77" y1="73" x2="81" y2="77" stroke="#141416" stroke-width="2" stroke-linecap="round" />
    <line x1="123" y1="119" x2="119" y2="115" stroke="#141416" stroke-width="2" stroke-linecap="round" />
    <line x1="77" y1="119" x2="81" y2="115" stroke="#141416" stroke-width="2" stroke-linecap="round" />

    <!-- Rapid Stopwatch Sweeper Hand (pointing to ~2 o'clock) -->
    <line x1="100" y1="96" x2="124" y2="72" stroke="#EA552B" stroke-width="3.5" stroke-linecap="round" />
    <!-- Hand counterweight -->
    <line x1="100" y1="96" x2="90" y2="106" stroke="#EA552B" stroke-width="3" stroke-linecap="round" />
    <!-- Center Pivot Pin -->
    <circle cx="100" cy="96" r="4.5" fill="#141416" />

    <!-- Lightning Bolt Icon inside Dial (lower quadrant) -->
    <polygon points="98,105 106,105 102,114 108,114 96,126 99,117 93,117" fill="#F7D046" stroke="#141416" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Glass Reflection Highlights -->
    <path d="M 72 78 A 34 34 0 0 1 122 66" fill="none" stroke="#55BBDA" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Sparkles & Energy Stars -->
  <g stroke="#141416" stroke-width="1.8" stroke-linejoin="round">
    <path d="M 162 70 Q 166 74 170 74 Q 166 74 162 78 Q 166 74 162 70" fill="#F7D046" />
    <circle cx="170" cy="116" r="3" fill="#EA552B" />
    <path d="M 40 46 Q 44 50 48 50 Q 44 50 40 54 Q 44 50 40 46" fill="#0BDC85" />
  </g>
</svg>
