<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Top Horizontal Pinned Ribbon Bar -->
  <rect x="45" y="24" width="110" height="28" rx="6" fill="#55BBDA" stroke="#141416" stroke-width="3.5" />
  <line x1="55" y1="38" x2="145" y2="38" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" />
  <!-- Ribbon Bar Pin Clasps -->
  <rect x="40" y="22" width="8" height="32" rx="3" fill="#F7D046" stroke="#141416" stroke-width="2.5" />
  <rect x="152" y="22" width="8" height="32" rx="3" fill="#F7D046" stroke="#141416" stroke-width="2.5" />

  <!-- Hanging Neck / Clasp Ring -->
  <path d="M88 52 L88 74 L112 74 L112 52" fill="none" stroke="#141416" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="100" cy="74" r="7" fill="#FDE68A" stroke="#141416" stroke-width="2.5" />

  <!-- Medallion Shadow & Base -->
  <circle cx="102" cy="128" r="48" fill="#141416" opacity="0.12" />
  <circle cx="100" cy="125" r="48" fill="#F7D046" stroke="#141416" stroke-width="3.5" />

  <!-- Inner Textured Stepped Rim -->
  <circle cx="100" cy="125" r="40" fill="#FBE8DE" stroke="#141416" stroke-width="2.5" />
  <circle cx="100" cy="125" r="34" fill="#F7D046" stroke="#141416" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Center 3-Star Mastery Tier (★ ★ ★) -->
  <!-- Middle Big Star -->
  <path d="M100 102 L104 113 L115 114 L106 122 L109 133 L100 127 L91 133 L94 122 L85 114 L96 113 Z" 
        fill="#FFFFFF" stroke="#141416" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Left Flanking Star -->
  <path d="M80 125 L82 131 L88 132 L83 136 L85 142 L80 138 L75 142 L77 136 L72 132 L78 131 Z" 
        fill="#EA552B" stroke="#141416" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Flanking Star -->
  <path d="M120 125 L122 131 L128 132 L123 136 L125 142 L120 138 L115 142 L117 136 L112 132 L118 131 Z" 
        fill="#EA552B" stroke="#141416" stroke-width="2" stroke-linejoin="round" />

  <!-- Mastery Label Arc -->
  <path d="M82 153 Q100 159 118 153" fill="none" stroke="#141416" stroke-width="2.5" stroke-linecap="round" />

  <!-- Twinkles -->
  <path d="M162 90 Q162 96 168 96 Q162 96 162 102 Q162 96 156 96 Q162 96 162 90 Z" fill="#F7D046" stroke="#141416" stroke-width="1.5" />
  <circle cx="36" cy="116" r="2.5" fill="#141416" />
</svg>