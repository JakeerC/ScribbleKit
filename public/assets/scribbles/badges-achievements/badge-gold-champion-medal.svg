           Q107 94 112 98 Q118 97 122 102 Q128 104 130 110 Q135 114 136 120 Q139 126 137 132 Q139 138 135 143 Q135 149 130 153 Q127 158 121 160 Q117 165 111 165 Q106 168 100 168 Q94 168 89 165 Q83 165 79 160 Q73 158 70 153 Q65 149 65 143 Q61 138 63 132 Q61 126 64 120 Q65 114 70 110 Q72 104 78 102 Q82 97 88 98 Q93 94 100 94 Z" 
