  <polygon points="152,142 158,138 162,144 156,148 150,146" fill="#55BBDA" stroke="#141416" stroke-width="2" stroke-linejoin="round" />

  <!-- Sparkles -->
  <path d="M166 94 Q166 100 172 100 Q166 100 166 106 Q166 100 160 100 Q166 100 166 94 Z" fill="#F7D046" stroke="#141416" stroke-width="1.5" />
  <circle cx="48" cy="146" r="2.5" fill="#141416" />
</svg>