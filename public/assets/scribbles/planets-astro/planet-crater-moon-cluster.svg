  <circle cx="88" cy="104" r="46" fill="#E2E8F0" stroke="#141416" stroke-width="3.5" />

  <!-- Moon Craters with Hand-Drawn Inner Shadow Arcs -->
  <circle cx="70" cy="88" r="9" fill="#CBD5E1" stroke="#141416" stroke-width="2.5" />
  <path d="M64 88 A6 6 0 0 0 76 88" fill="none" stroke="#64748B" stroke-width="2" />
  <circle cx="106" cy="94" r="12" fill="#CBD5E1" stroke="#141416" stroke-width="2.5" />
  <path d="M98 94 A8 8 0 0 0 114 94" fill="none" stroke="#64748B" stroke-width="2" />
  <circle cx="78" cy="122" r="7" fill="#CBD5E1" stroke="#141416" stroke-width="2.5" />
  <circle cx="112" cy="126" r="6" fill="#CBD5E1" stroke="#141416" stroke-width="2.5" />

  <!-- Companion Mini Saturn (Top Right) -->
