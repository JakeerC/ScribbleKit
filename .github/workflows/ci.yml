name: CI & Build Verification

on:
  push:
    branches:
      - main
      - cicd/**
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript & Build Bundle
        run: npm run build
